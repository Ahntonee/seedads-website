<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 &mdash; Page Not Found | SeedsAds</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-dark:#0A2540; --primary-blue:#0066FF; --accent-blue:#4D9FFF;
      --soft-white:#FAFBFC; --text-dark:#1A1A2E; --text-gray:#6B7280;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;min-height:100vh;background:var(--soft-white);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center}
    .logo{font-family:'Space Grotesk',sans-serif;font-size:1.6rem;font-weight:700;color:var(--primary-dark);text-decoration:none;margin-bottom:3rem;display:inline-flex;align-items:center;gap:.4rem}
    .logo span{color:var(--primary-blue)}
    .code{font-family:'Space Grotesk',sans-serif;font-size:7rem;font-weight:700;line-height:1;background:linear-gradient(135deg,#0A2540,#0066FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    h1{font-size:1.75rem;font-weight:700;color:var(--text-dark);margin:.75rem 0 .75rem}
    p{color:var(--text-gray);max-width:420px;line-height:1.7;margin-bottom:2.5rem}
    .actions{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center}
    .btn{padding:.75rem 1.75rem;border-radius:10px;font-size:.95rem;font-weight:600;text-decoration:none;transition:all .2s;display:inline-flex;align-items:center;gap:.5rem}
    .btn-primary{background:linear-gradient(135deg,#0A2540,#0066FF);color:white}
    .btn-primary:hover{opacity:.9;transform:translateY(-1px)}
    .btn-secondary{background:#E6F0FF;color:#0066FF;border:1.5px solid #C3D9FF}
    .btn-secondary:hover{background:#C3D9FF}
    .illustration{margin:1.5rem 0;opacity:.12}
  </style>
</head>
<body>
  <a href="/index.html" class="logo">Seeds<span>Ads</span></a>

  <div class="code">404</div>
  <h1>Page Not Found</h1>
  <p>The page you're looking for doesn't exist or may have been moved. Let's get you back on track.</p>

  <div class="actions">
    <a href="/index.html" class="btn btn-primary">
      <i class="fas fa-home"></i> Back to Home
    </a>
    <a href="/about/contact.html" class="btn btn-secondary">
      <i class="fas fa-envelope"></i> Contact Us
    </a>
  </div>
<!-- Donate widget -->
<script>window.DONATE_CONFIG={apiBase:'',publicKey:'FLWPUBK-XXXXXXXXXXXXXXXX-X',title:'Support SeedsAds',currency:'NGN',presets:[1000,5000,10000,25000]};</script>
<script src="/donate-widget.js" defer></script>
</body>
</html>
